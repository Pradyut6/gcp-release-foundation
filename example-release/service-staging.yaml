apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: release-demo
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
    spec:
      serviceAccountName: release-runtime@replace-staging-project.iam.gserviceaccount.com
      containers:
        - image: app
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
  traffic:
    - percent: 100
      latestRevision: true
